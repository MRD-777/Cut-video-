name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Show repo files
        run: ls -la
      - name: Create Capacitor project files
        run: |
          test -f index.html || { echo "index.html is missing in the repo root"; exit 1; }
          cat > package.json <<'EOF'
          {
            "name": "shorts-cutter",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            },
            "devDependencies": { "@capacitor/cli": "^6.2.0" }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mrd.shortscutter",
            "appName": "مقص الشورتس",
            "webDir": "www"
          }
          EOF
      - name: Prepare web files
        run: |
          mkdir -p www
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "skip $f"; fi
          done
          ls -la www
      - name: Generate Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-cutter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
